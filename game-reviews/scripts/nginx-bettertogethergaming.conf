# /etc/nginx/sites-available/bettertogethergaming
# Better Together Gaming: staging (deploy-staging.sh) and live (deploy.sh).
# Kept in the repo for reference; the server copy is the one that counts.

# Cache-Control by path. Vite puts hashed, never-changing files in /assets/,
# so those can be cached for a year. Everything else (HTML, sitemap, favicon)
# revalidates every time: deploys swap dist wholesale, so a cached HTML page
# could point at a bundle that no longer exists.
map $uri $btg_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

# ---- staging.bettertogethergaming.com. Not for search engines. ----

server {
    listen 80;
    server_name staging.bettertogethergaming.com;
    return 301 https://staging.bettertogethergaming.com$request_uri;
}

server {
    listen 443 ssl;
    server_name staging.bettertogethergaming.com;

    ssl_certificate /etc/letsencrypt/live/staging.bettertogethergaming.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.bettertogethergaming.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Server-level only: an add_header inside a location would drop all of these.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $btg_cache_control always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               text/xml application/xml image/svg+xml image/x-icon;

    access_log /var/log/nginx/bettertogethergaming-staging.access.log;

    root /var/www/bettertogethergaming-staging/dist/;
    index index.html;

    # /about/ -> /about. The `.+` stops "/" from redirecting to itself.
    rewrite ^/(.+)/$ /$1 permanent;

    # Styled 404 page (written by scripts/postbuild.js), served with status 404.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Every route is a prerendered folder (about/index.html, games/<slug>/index.html),
    # so serve that file directly. Unknown paths get the 404 page.
    location / {
        try_files $uri $uri/index.html =404;
    }
}

# ---- bettertogethergaming.com and www ----

server {
    listen 80;
    server_name bettertogethergaming.com www.bettertogethergaming.com;
    return 301 https://bettertogethergaming.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.bettertogethergaming.com;

    ssl_certificate /etc/letsencrypt/live/bettertogethergaming.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bettertogethergaming.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://bettertogethergaming.com$request_uri;
}

server {
    listen 443 ssl;
    server_name bettertogethergaming.com;

    ssl_certificate /etc/letsencrypt/live/bettertogethergaming.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bettertogethergaming.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Server-level only: an add_header inside a location would drop all of these.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control $btg_cache_control always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               text/xml application/xml image/svg+xml image/x-icon;

    access_log /var/log/nginx/bettertogethergaming.access.log;

    root /var/www/enochtsang/dist/;
    index index.html;

    # /about/ -> /about. The `.+` stops "/" from redirecting to itself.
    rewrite ^/(.+)/$ /$1 permanent;

    # Styled 404 page (written by scripts/postbuild.js), served with status 404.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Every route is a prerendered folder (about/index.html, games/<slug>/index.html),
    # so serve that file directly. Unknown paths get the 404 page.
    location / {
        try_files $uri $uri/index.html =404;
    }
}
