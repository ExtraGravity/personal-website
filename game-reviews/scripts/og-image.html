<!doctype html>
<!-- Source for public/og-image.png, the 1200x630 link-preview image.
     Regenerate with:  bash scripts/og-image.sh
     The mark is the same drawing as src/components/SiteLogo.vue. -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background-color: #070b18;
    background-image:
      linear-gradient(rgba(42, 245, 255, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(42, 245, 255, 0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 44px;
    font-family: 'Bebas Neue', sans-serif;
  }
  svg { width: 230px; height: 230px; flex: none; }
  .title { color: #ddeeff; font-size: 104px; letter-spacing: 0.1em; line-height: 0.95; }
  .sub {
    margin-top: 22px;
    color: #2af5ff;
    font-family: 'Share Tech Mono', monospace;
    font-size: 30px;
    letter-spacing: 0.42em;
  }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: #2af5ff; }
</style>
</head>
<body>
  <svg viewBox="0 0 64 64">
    <rect x="1" y="1" width="62" height="62" fill="#070b18" stroke="#2af5ff" stroke-opacity="0.35" stroke-width="2" />
    <polygon points="11,8 37,27 11,46" fill="#2af5ff" />
    <polygon points="25,19 49,37 25,55" fill="none" stroke="#ddeeff" stroke-width="5.5" stroke-linejoin="miter" />
  </svg>
  <div>
    <div class="title">Better Together<br>Gaming</div>
    <div class="sub">CO-OP GAME REVIEWS</div>
  </div>
  <div class="bar"></div>
</body>
</html>
